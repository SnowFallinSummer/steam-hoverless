name: Validate Plugin Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin
        run: |
          mkdir -p dist
          bun run build -- --release --of dist

      - name: Verify package
        run: ./node_modules/.bin/starlight verify dist/steam_hoverless.star

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: Steam-Hoverless-star
          path: dist/steam_hoverless.star
          if-no-files-found: error
