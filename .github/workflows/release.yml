name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (for example v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin
        run: |
          mkdir -p dist
          bun run build -- --release --of dist

      - name: Verify package
        run: |
          mapfile -t PACKAGES < <(find dist -maxdepth 1 -type f -name '*.star' -print)
          test "${#PACKAGES[@]}" -eq 1
          ./node_modules/.bin/starlight verify "${PACKAGES[0]}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Steam Hoverless ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.star
